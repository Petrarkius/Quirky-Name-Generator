# Quirky Name Generator (QNG) Lexicon & Word Banks
# Served statically at /lexicon.yaml and loaded at startup.
# You can customize roles, personalities, and word banks here without rebuilding.

roles:
  - "Custodial Megastructure / Planetary Iterator"
  - "Rapid Offensive Unit (Combat Warship)"
  - "General Systems Vehicle (Civilian Habitat)"
  - "Contact / Anthropological Scout"
  - "Esoteric Void Calculator"
  - "Eccentric / Independent Mind"

personalities:
  - "Dry Satirist (Ironic / Bureaucratic)"
  - "Weary Sovereign (Melancholic / Ascetic)"
  - "Gentle Monster (Lethal / Exquisitely Courteous)"
  - "Arrogant Demiurge (Impatient / Superior)"
  - "Detached Mystic (Zen / Non-linear)"
  - "Smug Meddler (Chaotic / Subversive)"

archetypes:
  - id: bureaucratic
    title: "Bureaucratic Euphemism"
    formula: "[Modifier] + [Institutional Noun]"
    inspiration: "Culture Mind registry understatement"
    examples:
      - "No Significant Harassment"
      - "Frank Exchange of Views"
      - "Polite Disassembly"
  - id: conversational
    title: "Conversational Clause"
    formula: "[Idiomatic Prefix] + [Action / Concept]"
    inspiration: "Dry conversational ship names"
    examples:
      - "So Much For Subtlety"
      - "I Blame Your Education"
      - "Just Read The Instructions"
  - id: ascetic
    title: "Zen / Ascetic Posture"
    formula: "[Action Verb] + [Natural Phenomenon]"
    inspiration: "Rain World Iterator contemplation"
    examples:
      - "Looks to the Moon"
      - "Chasing Wind"
      - "Listening to the Silt"
  - id: humility
    title: "Paradoxical Humility"
    formula: "[Quantifier / Fragment] + [Mundane Object]"
    inspiration: "Ascetic minimalism vs. godlike scale"
    examples:
      - "Five Pebbles"
      - "Sliver of Straw"
      - "Three Grains of Ash"

